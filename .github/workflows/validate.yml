name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Go validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate config artifacts
        shell: bash
        run: |
          export CGO_ENABLED=0
          go run ./cmd/hummingctl generate

      - name: Validate project
        shell: bash
        run: |
          export CGO_ENABLED=0
          go run ./cmd/hummingctl validate

      - name: Go test
        shell: bash
        run: |
          export CGO_ENABLED=0
          go test ./...

      - name: Go vet
        shell: bash
        run: |
          export CGO_ENABLED=0
          go vet ./...
